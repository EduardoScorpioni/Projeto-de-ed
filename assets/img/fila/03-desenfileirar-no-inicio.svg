    <text x="798" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="798" dy="0">prox</tspan></text>
  </g>
      
        <text x="250" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="250" dy="0">remover</tspan></text>
