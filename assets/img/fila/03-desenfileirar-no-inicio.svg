    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">1. Guardar</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Uma variável auxiliar</tspan><tspan x="1196" dy="26.88">recebe o nó apontado</tspan><tspan x="1196" dy="26.88">por início.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#168c7a"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">2. Avançar</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Início recebe</tspan><tspan x="1196" dy="26.88">inicio.prox. Se</tspan><tspan x="1196" dy="26.88">esvaziar, fim também</tspan><tspan x="1196" dy="26.88">vira null.</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">A remoção respeita FIFO e custa O(1).</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">03 / 04</tspan></text>
