        <line x1="580" y1="690" x2="745" y2="690" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrow-accent)"/>
        <text x="250" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="250" dy="0">1</tspan></text>
        <text x="495" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="495" dy="0">2</tspan></text>
        <text x="740" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="740" dy="0">3</tspan></text>
        <text x="575" y="840" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="575" dy="0">aux = aux.prox até chegar a null</tspan></text>
      </g>
