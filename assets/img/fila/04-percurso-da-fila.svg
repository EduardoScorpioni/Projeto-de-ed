    <rect x="410" y="500" width="170" height="98" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="526" y1="514" x2="526" y2="584" stroke="#d8e1ea" stroke-width="2"/>
    
    <text x="468" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="468" dy="0">45</tspan></text>
    <text x="553" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="553" dy="0">prox</tspan></text>
  </g>
