    <rect x="655" y="500" width="170" height="98" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="771" y1="514" x2="771" y2="584" stroke="#d8e1ea" stroke-width="2"/>
    
    <text x="713" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="713" dy="0">89</tspan></text>
    <text x="798" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="798" dy="0">prox</tspan></text>
  </g>
      
        <line x1="825" y1="549" x2="925" y2="549" stroke="#5b6b7b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
        <text x="950" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="800" text-anchor="start"><tspan x="950" dy="0">null</tspan></text>
