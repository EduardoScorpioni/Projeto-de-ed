    <text x="553" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="553" dy="0">prox</tspan></text>
  </g>
      <line x1="580" y1="689" x2="637" y2="689" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/><g>
    <rect x="655" y="640" width="170" height="98" rx="18" fill="var(--soft)" stroke="var(--accent)" stroke-width="3"/>
    <line x1="771" y1="654" x2="771" y2="724" stroke="#d8e1ea" stroke-width="2"/>
    
    <text x="713" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="713" dy="0">60</tspan></text>
    <text x="798" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="798" dy="0">prox</tspan></text>
  </g>
      
        <text x="740" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="740" dy="0">novo fim</tspan></text>
        <line x1="740" y1="770" x2="740" y2="748" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#168c7a"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">1. Encadear</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">O campo prox do antigo</tspan><tspan x="1196" dy="26.88">fim passa a apontar</tspan><tspan x="1196" dy="26.88">para o novo nó.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#168c7a"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">2. Atualizar</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">O ponteiro fim recebe o</tspan><tspan x="1196" dy="26.88">novo nó. A operação</tspan><tspan x="1196" dy="26.88">custa O(1).</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Quem chega por último espera atrás dos elementos que já estavam na fila.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">02 / 04</tspan></text>
</svg>