<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Enfileirar: inserir no fim</title>
  <desc id="desc">O novo nó entra depois do fim atual e se torna o novo ponteiro fim.</desc>
  <defs>
