  </g>
      
        <text x="570" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="570" dy="0">fim</tspan></text>
        <text x="860" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="860" dy="0">NOVO NÓ</tspan></text>
