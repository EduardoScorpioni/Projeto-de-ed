<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Início, fim e nós encadeados</title>
  <desc id="desc">Dois ponteiros de controle mantêm a entrada e a saída da fila em tempo constante.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168c7a"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c94f45"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d8891f"/></marker>
    <style>.card { filter: url(#shadow); }</style>
  </defs>
  <rect width="1600" height="1130" fill="#fbfcff"/>
  <rect width="1600" height="16" fill="#168c7a"/>
  <rect y="1112" width="1600" height="18" fill="#168c7a"/>
  <text x="90" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#168c7a" font-weight="800" text-anchor="start"><tspan x="90" dy="0">ESTRUTURA FIFO</tspan></text>
  <text x="1370" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1370" dy="0">Grupo 6 | Estrutura de Dados</tspan></text>
  <text x="90" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="58" fill="#172331" font-weight="900" text-anchor="start"><tspan x="90" dy="0">Início, fim e nós encadeados</tspan></text>
  <text x="94" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="94" dy="0">Dois ponteiros de controle mantêm a entrada e a saída da fila em tempo constante.</tspan></text>
  <g class="card">
    <rect x="90" y="300" width="1000" height="620" rx="22" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <g style="--accent:#168c7a;--soft:#e9f7f4">
        <text x="190" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="190" dy="0">INÍCIO</tspan></text>
        <line x1="190" y1="425" x2="215" y2="482" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <text x="735" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#168c7a" font-weight="900" text-anchor="middle"><tspan x="735" dy="0">FIM</tspan></text>
        <line x1="735" y1="425" x2="705" y2="482" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <g>
    <rect x="165" y="495" width="170" height="98" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="281" y1="509" x2="281" y2="579" stroke="#d8e1ea" stroke-width="2"/>
    
    <text x="223" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="223" dy="0">12</tspan></text>
    <text x="308" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="308" dy="0">prox</tspan></text>
  </g>
      <line x1="335" y1="544" x2="392" y2="544" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/><g>
    <rect x="410" y="495" width="170" height="98" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="526" y1="509" x2="526" y2="579" stroke="#d8e1ea" stroke-width="2"/>
    
    <text x="468" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="468" dy="0">45</tspan></text>
    <text x="553" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="553" dy="0">prox</tspan></text>
  </g>
      <line x1="580" y1="544" x2="637" y2="544" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/><g>
    <rect x="655" y="495" width="170" height="98" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="771" y1="509" x2="771" y2="579" stroke="#d8e1ea" stroke-width="2"/>
    
    <text x="713" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="713" dy="0">89</tspan></text>
    <text x="798" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="798" dy="0">prox</tspan></text>
  </g>
      
        <line x1="825" y1="544" x2="925" y2="544" stroke="#5b6b7b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
        <text x="955" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#5b6b7b" font-weight="800" text-anchor="start"><tspan x="955" dy="0">null</tspan></text>
        <text x="250" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#c94f45" font-weight="800" text-anchor="middle"><tspan x="250" dy="0">1º a sair</tspan></text>
        <text x="740" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#168c7a" font-weight="800" text-anchor="middle"><tspan x="740" dy="0">último inserido</tspan></text>
        <text x="250" y="742" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c94f45" font-weight="800" text-anchor="middle"><tspan x="250" dy="0">saída</tspan></text>
        <line x1="250" y1="705" x2="250" y2="670" stroke="#c94f45" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-rose)"/>
        <text x="740" y="742" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#168c7a" font-weight="800" text-anchor="middle"><tspan x="740" dy="0">entrada</tspan></text>
        <line x1="740" y1="705" x2="740" y2="670" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#168c7a"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Início</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Aponta para o primeiro</tspan><tspan x="1196" dy="26.88">nó, que será o próximo</tspan><tspan x="1196" dy="26.88">elemento removido.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#168c7a"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Fim</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Aponta para o último nó</tspan><tspan x="1196" dy="26.88">e permite inserir sem</tspan><tspan x="1196" dy="26.88">percorrer a fila.</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Cada nó guarda um valor e uma referência para o próximo.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">01 / 04</tspan></text>
</svg>