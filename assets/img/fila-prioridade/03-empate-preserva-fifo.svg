<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Empate de prioridade preserva FIFO</title>
  <desc id="desc">Entre elementos com a mesma prioridade, quem chegou primeiro continua na frente.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6957a8"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c94f45"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d8891f"/></marker>
    <style>.card { filter: url(#shadow); }</style>
  </defs>
  <rect width="1600" height="1130" fill="#fbfcff"/>
  <rect width="1600" height="16" fill="#6957a8"/>
  <rect y="1112" width="1600" height="18" fill="#6957a8"/>
  <text x="90" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6957a8" font-weight="800" text-anchor="start"><tspan x="90" dy="0">ESTABILIDADE</tspan></text>
  <text x="1370" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1370" dy="0">Grupo 6 | Estrutura de Dados</tspan></text>
  <text x="90" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="58" fill="#172331" font-weight="900" text-anchor="start"><tspan x="90" dy="0">Empate de prioridade preserva FIFO</tspan></text>
  <text x="94" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="94" dy="0">Entre elementos com a mesma prioridade, quem chegou primeiro continua na frente.</tspan></text>
  <g class="card">
    <rect x="90" y="300" width="1000" height="620" rx="22" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <g style="--accent:#6957a8;--soft:#f1edfb">
        <text x="140" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="900" text-anchor="start"><tspan x="140" dy="0">ORDEM DE CHEGADA</tspan></text>
        <text x="275" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="275" dy="0">1º</tspan></text>
        <g>
    <rect x="190" y="465" width="170" height="98" rx="18" fill="#ffffff" stroke="#c94f45" stroke-width="3"/>
    <line x1="306" y1="479" x2="306" y2="549" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="202" y="477" width="92" height="26" rx="10" fill="#c94f45" opacity=".14"/><text x="248" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c94f45" font-weight="800" text-anchor="middle"><tspan x="248" dy="0">P1</tspan></text>
    <text x="248" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="248" dy="0">Ana</tspan></text>
    <text x="333" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="333" dy="0">prox</tspan></text>
  </g>
        <text x="610" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="610" dy="0">2º</tspan></text>
        <g>
    <rect x="525" y="465" width="170" height="98" rx="18" fill="var(--soft)" stroke="#c94f45" stroke-width="3"/>
    <line x1="641" y1="479" x2="641" y2="549" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="537" y="477" width="92" height="26" rx="10" fill="#c94f45" opacity=".14"/><text x="583" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c94f45" font-weight="800" text-anchor="middle"><tspan x="583" dy="0">P1</tspan></text>
    <text x="583" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="583" dy="0">Bruno</tspan></text>
    <text x="668" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="668" dy="0">prox</tspan></text>
  </g>
        <line x1="360" y1="514" x2="505" y2="514" stroke="#c94f45" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-rose)"/>
        <text x="445" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c94f45" font-weight="800" text-anchor="middle"><tspan x="445" dy="0">mesma prioridade</tspan></text>
        <line x1="695" y1="514" x2="845" y2="514" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <g>
    <rect x="865" y="465" width="170" height="98" rx="18" fill="#ffffff" stroke="#d8891f" stroke-width="3"/>
    <line x1="981" y1="479" x2="981" y2="549" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="877" y="477" width="92" height="26" rx="10" fill="#d8891f" opacity=".14"/><text x="923" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d8891f" font-weight="800" text-anchor="middle"><tspan x="923" dy="0">P2</tspan></text>
    <text x="923" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="923" dy="0">Caio</tspan></text>
    <text x="1008" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="1008" dy="0">prox</tspan></text>
  </g>
        <text x="140" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="900" text-anchor="start"><tspan x="140" dy="0">ATENDIMENTO</tspan></text>
        <rect x="190" y="725" width="820" height="82" rx="18" fill="#f7f5fc" stroke="#d8e1ea" stroke-width="2"/>
        <text x="310" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="310" dy="0">Ana</tspan></text>
        <line x1="380" y1="765" x2="505" y2="765" stroke="#c94f45" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-rose)"/>
        <text x="600" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="600" dy="0">Bruno</tspan></text>
        <line x1="690" y1="765" x2="810" y2="765" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <text x="900" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#d8891f" font-weight="900" text-anchor="middle"><tspan x="900" dy="0">Caio</tspan></text>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#6957a8"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Mesma prioridade</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Ana e Bruno são P1, mas</tspan><tspan x="1196" dy="26.88">Ana entrou antes na</tspan><tspan x="1196" dy="26.88">fila.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#6957a8"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Regra de inserção</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">O novo nó passa depois</tspan><tspan x="1196" dy="26.88">de todas as prioridades</tspan><tspan x="1196" dy="26.88">iguais.</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Prioridade decide o grupo; a ordem de chegada decide dentro do grupo.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">03 / 04</tspan></text>
</svg>