        <line x1="725" y1="559" x2="865" y2="555" stroke="#d8891f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
        <line x1="725" y1="719" x2="865" y2="625" stroke="#5b6b7b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
        <rect x="875" y="450" width="150" height="220" rx="24" fill="#ffffff" stroke="#6957a8" stroke-width="3"/>
        <text x="950" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#6957a8" font-weight="900" text-anchor="middle"><tspan x="950" dy="0">ORDEM</tspan></text>
        <text x="950" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="950" dy="0">1. P1</tspan></text>
        <text x="950" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#d8891f" font-weight="900" text-anchor="middle"><tspan x="950" dy="0">2. P2</tspan></text>
        <text x="950" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d5d94" font-weight="900" text-anchor="middle"><tspan x="950" dy="0">3. P3</tspan></text>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#6957a8"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Outros usos</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Escalonamento de CPU,</tspan><tspan x="1196" dy="26.88">pacotes de rede,</tspan><tspan x="1196" dy="26.88">impressão e algoritmos</tspan><tspan x="1196" dy="26.88">de caminhos.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#6957a8"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Ideia central</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">O dado e a prioridade</tspan><tspan x="1196" dy="26.88">viajam juntos dentro de</tspan><tspan x="1196" dy="26.88">cada nó.</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Fila de prioridades não significa atendimento aleatório: existe um critério explícito.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">04 / 04</tspan></text>
