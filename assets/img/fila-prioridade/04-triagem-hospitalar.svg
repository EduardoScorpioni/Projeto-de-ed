    <text x="613" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="613" dy="0">Emergência</tspan></text>
    <text x="698" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="698" dy="0">prox</tspan></text>
  </g>
        <g>
    <rect x="555" y="510" width="170" height="98" rx="18" fill="#ffffff" stroke="#d8891f" stroke-width="3"/>
    <line x1="671" y1="524" x2="671" y2="594" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="567" y="522" width="92" height="26" rx="10" fill="#d8891f" opacity=".14"/><text x="613" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d8891f" font-weight="800" text-anchor="middle"><tspan x="613" dy="0">P2</tspan></text>
    <text x="613" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="613" dy="0">Urgência</tspan></text>
    <text x="698" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="698" dy="0">prox</tspan></text>
  </g>
        <g>
    <rect x="555" y="670" width="170" height="98" rx="18" fill="#ffffff" stroke="#1d5d94" stroke-width="3"/>
    <line x1="671" y1="684" x2="671" y2="754" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="567" y="682" width="92" height="26" rx="10" fill="#1d5d94" opacity=".14"/><text x="613" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d5d94" font-weight="800" text-anchor="middle"><tspan x="613" dy="0">P3</tspan></text>
    <text x="613" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="613" dy="0">Normal</tspan></text>
    <text x="698" y="729" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="698" dy="0">prox</tspan></text>
