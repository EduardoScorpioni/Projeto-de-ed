        <text x="278" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#6957a8" font-weight="900" text-anchor="middle"><tspan x="278" dy="0">TRIAGEM</tspan></text>
        <text x="278" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="278" dy="0">avalia</tspan></text>
        <text x="278" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="278" dy="0">risco</tspan></text>
        <text x="278" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="278" dy="0">e urgência</tspan></text>
        <circle cx="278" cy="655" r="34" fill="#6957a8"/>
