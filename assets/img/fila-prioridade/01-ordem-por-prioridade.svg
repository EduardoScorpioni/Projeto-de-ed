<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Maior prioridade vem primeiro</title>
  <desc id="desc">A lista permanece ordenada para que o próximo atendimento esteja sempre no início.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6957a8"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c94f45"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d8891f"/></marker>
    <style>.card { filter: url(#shadow); }</style>
  </defs>
  <rect width="1600" height="1130" fill="#fbfcff"/>
  <rect width="1600" height="16" fill="#6957a8"/>
  <rect y="1112" width="1600" height="18" fill="#6957a8"/>
  <text x="90" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6957a8" font-weight="800" text-anchor="start"><tspan x="90" dy="0">ESTRUTURA ORDENADA</tspan></text>
  <text x="1370" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1370" dy="0">Grupo 6 | Estrutura de Dados</tspan></text>
  <text x="90" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="58" fill="#172331" font-weight="900" text-anchor="start"><tspan x="90" dy="0">Maior prioridade vem primeiro</tspan></text>
  <text x="94" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="94" dy="0">A lista permanece ordenada para que o próximo atendimento esteja sempre no início.</tspan></text>
  <g class="card">
    <rect x="90" y="300" width="1000" height="620" rx="22" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <g style="--accent:#6957a8;--soft:#f1edfb">
        <text x="210" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#6957a8" font-weight="900" text-anchor="middle"><tspan x="210" dy="0">INÍCIO</tspan></text>
        <line x1="210" y1="420" x2="230" y2="487" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <g>
    <rect x="155" y="500" width="170" height="98" rx="18" fill="#ffffff" stroke="#c94f45" stroke-width="3"/>
    <line x1="271" y1="514" x2="271" y2="584" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="167" y="512" width="92" height="26" rx="10" fill="#c94f45" opacity=".14"/><text x="213" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c94f45" font-weight="800" text-anchor="middle"><tspan x="213" dy="0">P1 • ALTA</tspan></text>
    <text x="213" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="213" dy="0">Ana</tspan></text>
    <text x="298" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="298" dy="0">prox</tspan></text>
  </g>
      <line x1="325" y1="549" x2="407" y2="549" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/><g>
    <rect x="425" y="500" width="170" height="98" rx="18" fill="#ffffff" stroke="#d8891f" stroke-width="3"/>
    <line x1="541" y1="514" x2="541" y2="584" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="437" y="512" width="92" height="26" rx="10" fill="#d8891f" opacity=".14"/><text x="483" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d8891f" font-weight="800" text-anchor="middle"><tspan x="483" dy="0">P2 • MÉDIA</tspan></text>
    <text x="483" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="483" dy="0">Bia</tspan></text>
    <text x="568" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="568" dy="0">prox</tspan></text>
  </g>
      <line x1="595" y1="549" x2="677" y2="549" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/><g>
    <rect x="695" y="500" width="170" height="98" rx="18" fill="#ffffff" stroke="#1d5d94" stroke-width="3"/>
    <line x1="811" y1="514" x2="811" y2="584" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="707" y="512" width="92" height="26" rx="10" fill="#1d5d94" opacity=".14"/><text x="753" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1d5d94" font-weight="800" text-anchor="middle"><tspan x="753" dy="0">P3 • NORMAL</tspan></text>
    <text x="753" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="753" dy="0">Caio</tspan></text>
    <text x="838" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="838" dy="0">prox</tspan></text>
  </g>
      
        <line x1="865" y1="549" x2="955" y2="549" stroke="#5b6b7b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
        <text x="980" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="800" text-anchor="start"><tspan x="980" dy="0">null</tspan></text>
        <text x="240" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="240" dy="0">1º</tspan></text>
        <text x="510" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#d8891f" font-weight="900" text-anchor="middle"><tspan x="510" dy="0">2º</tspan></text>
        <text x="780" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#1d5d94" font-weight="900" text-anchor="middle"><tspan x="780" dy="0">3º</tspan></text>
        <text x="575" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="575" dy="0">A prioridade organiza a cadeia antes do atendimento</tspan></text>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#6957a8"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">P1: emergência</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Permanece à frente de</tspan><tspan x="1196" dy="26.88">P2 e P3, mesmo quando</tspan><tspan x="1196" dy="26.88">chegou depois.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#6957a8"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Remoção rápida</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Como o mais urgente</tspan><tspan x="1196" dy="26.88">está no início,</tspan><tspan x="1196" dy="26.88">desenfileirar custa</tspan><tspan x="1196" dy="26.88">O(1).</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Ordem de atendimento: P1, depois P2 e por último P3.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">01 / 04</tspan></text>
</svg>