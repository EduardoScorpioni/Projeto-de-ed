<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Um único ponto de acesso: o topo</title>
  <desc id="desc">Cada nó aponta para o elemento que estava abaixo dele na pilha.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5d94"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c94f45"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d8891f"/></marker>
    <style>.card { filter: url(#shadow); }</style>
  </defs>
  <rect width="1600" height="1130" fill="#fbfcff"/>
  <rect width="1600" height="16" fill="#1d5d94"/>
  <rect y="1112" width="1600" height="18" fill="#1d5d94"/>
  <text x="90" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d5d94" font-weight="800" text-anchor="start"><tspan x="90" dy="0">ESTRUTURA LIFO</tspan></text>
  <text x="1370" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1370" dy="0">Grupo 6 | Estrutura de Dados</tspan></text>
  <text x="90" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="58" fill="#172331" font-weight="900" text-anchor="start"><tspan x="90" dy="0">Um único ponto de acesso: o topo</tspan></text>
  <text x="94" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="94" dy="0">Cada nó aponta para o elemento que estava abaixo dele na pilha.</tspan></text>
  <g class="card">
    <rect x="90" y="300" width="1000" height="620" rx="22" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <g style="--accent:#1d5d94;--soft:#eaf3fb">
        <text x="240" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d5d94" font-weight="900" text-anchor="middle"><tspan x="240" dy="0">TOPO</tspan></text>
        <line x1="255" y1="400" x2="385" y2="447" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <g>
    <rect x="425" y="400" width="310" height="92" rx="18" fill="var(--soft)" stroke="var(--accent)" stroke-width="3"/>
    <line x1="655" y1="414" x2="655" y2="478" stroke="#d8e1ea" stroke-width="2"/>
    <text x="540" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="540" dy="0">90</tspan></text>
    <text x="695" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="695" dy="0">prox</tspan></text>
  </g>
        <line x1="580" y1="492" x2="580" y2="535" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <g>
    <rect x="425" y="550" width="310" height="92" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="655" y1="564" x2="655" y2="628" stroke="#d8e1ea" stroke-width="2"/>
    <text x="540" y="609" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="540" dy="0">45</tspan></text>
    <text x="695" y="607" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="695" dy="0">prox</tspan></text>
  </g>
        <line x1="580" y1="642" x2="580" y2="685" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <g>
    <rect x="425" y="700" width="310" height="92" rx="18" fill="#ffffff" stroke="var(--accent)" stroke-width="3"/>
    <line x1="655" y1="714" x2="655" y2="778" stroke="#d8e1ea" stroke-width="2"/>
    <text x="540" y="759" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="540" dy="0">10</tspan></text>
    <text x="695" y="757" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="695" dy="0">prox</tspan></text>
  </g>
        <line x1="580" y1="792" x2="580" y2="850" stroke="#5b6b7b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
        <text x="580" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#5b6b7b" font-weight="800" text-anchor="middle"><tspan x="580" dy="0">null</tspan></text>
        <text x="830" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1d5d94" font-weight="800" text-anchor="start"><tspan x="830" dy="0">último a entrar</tspan></text>
        <text x="830" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c94f45" font-weight="800" text-anchor="start"><tspan x="830" dy="0">primeiro a sair</tspan></text>
        <text x="830" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="800" text-anchor="start"><tspan x="830" dy="0">base</tspan></text>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#1d5d94"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Topo</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Aponta para o último</tspan><tspan x="1196" dy="26.88">elemento empilhado e</tspan><tspan x="1196" dy="26.88">concentra push e pop.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#1d5d94"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Base</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">O último nó da cadeia</tspan><tspan x="1196" dy="26.88">aponta para null e</tspan><tspan x="1196" dy="26.88">marca o fim da pilha.</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Leitura a partir do topo: 90, depois 45, depois 10.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">01 / 04</tspan></text>
</svg>