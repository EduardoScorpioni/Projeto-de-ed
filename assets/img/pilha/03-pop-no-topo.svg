<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">Desempilhar: remover do topo</title>
  <desc id="desc">O topo atual é guardado e o ponteiro avança para o nó que estava logo abaixo.</desc>
