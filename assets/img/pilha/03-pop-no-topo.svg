    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">A referência auxiliar</tspan><tspan x="1196" dy="26.88">permite retornar o</tspan><tspan x="1196" dy="26.88">valor que saiu da</tspan><tspan x="1196" dy="26.88">pilha.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
