    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Novo topo</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">topo recebe topo.prox.</tspan><tspan x="1196" dy="26.88">A operação também custa</tspan><tspan x="1196" dy="26.88">O(1).</tspan></text>
