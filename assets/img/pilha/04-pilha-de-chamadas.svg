<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">A pilha de chamadas de um programa</title>
  <desc id="desc">Cada função ativa ocupa o topo; ao terminar, ela devolve o controle para quem a chamou.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5d94"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c94f45"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d8891f"/></marker>
    <style>.card { filter: url(#shadow); }</style>
  </defs>
  <rect width="1600" height="1130" fill="#fbfcff"/>
  <rect width="1600" height="16" fill="#1d5d94"/>
  <rect y="1112" width="1600" height="18" fill="#1d5d94"/>
  <text x="90" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#1d5d94" font-weight="800" text-anchor="start"><tspan x="90" dy="0">APLICAÇÃO PRÁTICA</tspan></text>
  <text x="1370" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1370" dy="0">Grupo 6 | Estrutura de Dados</tspan></text>
  <text x="90" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="58" fill="#172331" font-weight="900" text-anchor="start"><tspan x="90" dy="0">A pilha de chamadas de um programa</tspan></text>
  <text x="94" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="94" dy="0">Cada função ativa ocupa o topo; ao terminar, ela devolve o controle para quem a chamou.</tspan></text>
  <g class="card">
    <rect x="90" y="300" width="1000" height="620" rx="22" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <g style="--accent:#1d5d94;--soft:#eaf3fb">
        <text x="300" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1d5d94" font-weight="900" text-anchor="middle"><tspan x="300" dy="0">CHAMADAS</tspan></text>
        <rect x="145" y="400" width="310" height="88" rx="18" fill="#eaf3fb" stroke="#1d5d94" stroke-width="3"/>
        <text x="300" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1d5d94" font-weight="900" text-anchor="middle"><tspan x="300" dy="0">validar()</tspan></text>
        <rect x="145" y="510" width="310" height="88" rx="18" fill="#ffffff" stroke="#1d5d94" stroke-width="3"/>
        <text x="300" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="300" dy="0">calcular()</tspan></text>
        <rect x="145" y="620" width="310" height="88" rx="18" fill="#ffffff" stroke="#1d5d94" stroke-width="3"/>
        <text x="300" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="900" text-anchor="middle"><tspan x="300" dy="0">Main()</tspan></text>
        <line x1="470" y1="665" x2="610" y2="665" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-accent)"/>
        <text x="815" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="815" dy="0">RETORNOS</tspan></text>
        <rect x="650" y="410" width="330" height="298" rx="22" fill="#fff8f7" stroke="#d8e1ea" stroke-width="2"/>
        <text x="710" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="710" dy="0">1</tspan></text>
        <text x="790" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#172331" font-weight="800" text-anchor="start"><tspan x="790" dy="0">validar()</tspan></text>
        <text x="710" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="710" dy="0">2</tspan></text>
        <text x="790" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#172331" font-weight="800" text-anchor="start"><tspan x="790" dy="0">calcular()</tspan></text>
        <text x="710" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#c94f45" font-weight="900" text-anchor="middle"><tspan x="710" dy="0">3</tspan></text>
        <text x="790" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#172331" font-weight="800" text-anchor="start"><tspan x="790" dy="0">Main()</tspan></text>
        <text x="575" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#5b6b7b" font-weight="700" text-anchor="middle"><tspan x="575" dy="0">A função no topo termina primeiro</tspan></text>
      </g>
  </g>
  <g class="card">
    <rect x="1160" y="330" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="330" width="12" height="230" rx="6" fill="#1d5d94"/>
    <text x="1196" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Chamadas</tspan></text>
    <text x="1196" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">Main chama calcular,</tspan><tspan x="1196" dy="26.88">que chama validar. Cada</tspan><tspan x="1196" dy="26.88">nova chamada é</tspan><tspan x="1196" dy="26.88">empilhada.</tspan></text>
  </g>
  <g class="card">
    <rect x="1160" y="620" width="350" height="230" rx="18" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <rect x="1160" y="620" width="12" height="230" rx="6" fill="#1d5d94"/>
    <text x="1196" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#172331" font-weight="800" text-anchor="start"><tspan x="1196" dy="0">Retornos</tspan></text>
    <text x="1196" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="1196" dy="0">validar termina</tspan><tspan x="1196" dy="26.88">primeiro, depois</tspan><tspan x="1196" dy="26.88">calcular e por último</tspan><tspan x="1196" dy="26.88">Main.</tspan></text>
  </g>
  <line x1="90" y1="1044" x2="1510" y2="1044" stroke="#d8e1ea" stroke-width="2"/>
  <text x="90" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Chamadas entram em uma ordem e retornam na ordem inversa.</tspan></text>
  <text x="1510" y="1082" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#5b6b7b" font-weight="400" text-anchor="end"><tspan x="1510" dy="0">04 / 04</tspan></text>
</svg>